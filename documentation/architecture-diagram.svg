<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    ARINC828Forge Pro (v1.0.0) Architecture &amp; Data Diode Gateway
  </text>
  <text x="480" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    Electronic Flight Bag (EFB) Standard Interface | ARINC 828A, RTCA DO-257B &amp; FAA AC 120-76D
  </text>

  <!-- Block 1: Aircraft Avionics Control Domain (ACD) -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">AIRCRAFT CONTROL DOMAIN</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• Flight Management (FMC)</text>
    <text x="20" y="105" font-family="monospace" font-size="12" fill="#cbd5e1">• Air Data &amp; Inertial (ADIRS)</text>
    <text x="20" y="135" font-family="monospace" font-size="12" fill="#cbd5e1">• Multi-Mode Receiver (MMR)</text>
    <text x="20" y="165" font-family="monospace" font-size="12" fill="#cbd5e1">• ARINC 429 Digital Buses</text>
    <text x="35" y="185" font-family="monospace" font-size="11" fill="#94a3b8">- Lat/Lon (110/111)</text>
    <text x="35" y="205" font-family="monospace" font-size="11" fill="#94a3b8">- Ground Speed (112)</text>
    <text x="35" y="225" font-family="monospace" font-size="11" fill="#94a3b8">- Heading (314), Alt (203)</text>
    <text x="20" y="255" font-family="monospace" font-size="12" fill="#cbd5e1">• Discrete WOW Sensing</text>
    <text x="20" y="285" font-family="monospace" font-size="12" fill="#cbd5e1">• Fuel Totalizer (134)</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#042f2e" stroke="#14b8a6"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#2dd4bf">DO-178C DAL-A/B CERTIFIED</text>
  </g>

  <!-- Block 2: Aircraft Interface Device (AID) Gateway -->
  <g transform="translate(350, 110)" filter="url(#shadow)">
    <rect width="260" height="370" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">ARINC 828A AID GATEWAY</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#e2e8f0">• ARINC 429 to IP Converter</text>
    <text x="20" y="105" font-family="monospace" font-size="12" fill="#e2e8f0">• Unidirectional Data Diode</text>
    <text x="35" y="125" font-family="monospace" font-size="11" fill="#94a3b8">- Optical Diode Hardware</text>
    <text x="35" y="145" font-family="monospace" font-size="11" fill="#94a3b8">- AC 120-76D Non-Interference</text>
    <text x="20" y="175" font-family="monospace" font-size="12" fill="#e2e8f0">• JSON / UDP Telemetry Feed</text>
    <text x="20" y="205" font-family="monospace" font-size="12" fill="#e2e8f0">• DO-257B NIC Integrity Filter</text>
    <text x="35" y="225" font-family="monospace" font-size="11" fill="#94a3b8">- NIC >= 7 Surface Gating</text>
    <text x="20" y="255" font-family="monospace" font-size="12" fill="#e2e8f0">• 28V DC Power Conditioner</text>
    <text x="20" y="285" font-family="monospace" font-size="12" fill="#e2e8f0">• USB-PD / Gigabit Ethernet</text>
    <rect x="20" y="325" width="220" height="30" rx="4" fill="#172554" stroke="#3b82f6"/>
    <text x="130" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#60a5fa">AISD SECURITY ISOLATION</text>
  </g>

  <!-- Block 3: Electronic Flight Bag (EFB) Tablet -->
  <g transform="translate(670, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a855f7">CLASS 2 MOUNTED EFB</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• Airport Moving Map (AMM)</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- Own-Ship Surface Taxi</text>
    <text x="35" y="115" font-family="monospace" font-size="11" fill="#94a3b8">- Runway Incursion Avoidance</text>
    <text x="20" y="145" font-family="monospace" font-size="12" fill="#cbd5e1">• Onboard Performance Tool</text>
    <text x="35" y="165" font-family="monospace" font-size="11" fill="#94a3b8">- V1, VR, V2 Takeoff Speeds</text>
    <text x="35" y="185" font-family="monospace" font-size="11" fill="#94a3b8">- ASDA / TODA Feasibility</text>
    <text x="20" y="215" font-family="monospace" font-size="12" fill="#cbd5e1">• Weight &amp; Balance Manifest</text>
    <text x="20" y="245" font-family="monospace" font-size="12" fill="#cbd5e1">• Weather &amp; Enroute Charts</text>
    <text x="20" y="275" font-family="monospace" font-size="12" fill="#cbd5e1">• Electronic Tech Log (ETL)</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#3b0764" stroke="#a855f7"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#d8b4fe">EASA AMC 20-25 COMPLIANT</text>
  </g>

  <!-- Connectors -->
  <line x1="290" y1="295" x2="350" y2="295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <line x1="610" y1="295" x2="670" y2="295" stroke="#06b6d4" stroke-width="2"/>
</svg>