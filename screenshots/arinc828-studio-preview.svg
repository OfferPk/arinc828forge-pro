<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#studioBg)"/>

  <!-- Window Header -->
  <rect width="1000" height="50" fill="#111827" stroke="#1f293d" stroke-width="1"/>
  <circle cx="25" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="31" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    ARINC828Forge Pro — Electronic Flight Bag &amp; AID Telemetry Studio (v1.0.0)
  </text>
  <rect x="740" y="14" width="235" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
  <text x="857" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">
    AMM SURFACE NIC 8 ACTIVE
  </text>

  <!-- Left: Performance Controls -->
  <rect x="20" y="70" width="280" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="35" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">TAKEOFF (OPT) CONFIG</text>

  <rect x="35" y="120" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="142" font-family="sans-serif" font-size="12" fill="#e2e8f0">Takeoff Weight: 220,000 kg</text>

  <rect x="35" y="170" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="192" font-family="sans-serif" font-size="12" fill="#e2e8f0">Flaps: FLAPS 15 (Optimum)</text>

  <rect x="35" y="220" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="242" font-family="sans-serif" font-size="12" fill="#e2e8f0">Runway Available: 4,000 m</text>

  <rect x="35" y="270" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="292" font-family="sans-serif" font-size="12" fill="#e2e8f0">OAT: +25°C | Wind: Calm</text>

  <rect x="35" y="320" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="342" font-family="sans-serif" font-size="12" fill="#e2e8f0">GPS Integrity: NIC 8 (Surface OK)</text>

  <rect x="35" y="380" width="250" height="40" rx="4" fill="#06b6d4"/>
  <text x="160" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">
    CALCULATE V-SPEEDS
  </text>

  <!-- Center: Airport Moving Map (AMM) & OPT Speeds -->
  <rect x="320" y="70" width="370" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="335" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">AIRPORT MOVING MAP (DO-257B AMM)</text>

  <!-- Canvas Box -->
  <rect x="335" y="120" width="340" height="200" rx="4" fill="#060b14" stroke="#1e293b"/>
  <!-- Runway 12L -->
  <rect x="350" y="195" width="310" height="30" fill="#1e293b" stroke="#475569"/>
  <line x1="360" y1="210" x2="650" y2="210" stroke="#f8fafc" stroke-dasharray="8,6" stroke-width="2"/>
  <text x="360" y="215" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">12L</text>
  <text x="630" y="215" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">30R</text>

  <!-- Taxiway -->
  <rect x="350" y="250" width="310" height="20" fill="#0f172a" stroke="#334155"/>
  <line x1="350" y1="260" x2="660" y2="260" stroke="#eab308" stroke-width="1.5"/>

  <!-- Ownship Icon -->
  <circle cx="460" cy="260" r="14" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" stroke-dasharray="2"/>
  <polygon points="460,252 466,266 460,263 454,266" fill="#38bdf8"/>

  <text x="350" y="145" font-family="monospace" font-size="10" fill="#94a3b8">AIRPORT: OMDB (DUBAI INTL)</text>
  <text x="350" y="165" font-family="monospace" font-size="10" fill="#06b6d4">POS: 25.2532° N, 55.3657° E | NIC 8</text>

  <text x="335" y="350" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">ONBOARD PERFORMANCE TOOL (OPT) SPEEDS</text>
  <rect x="335" y="370" width="340" height="185" rx="4" fill="#090e18" stroke="#1e293b"/>
  <text x="350" y="395" font-family="monospace" font-size="11" fill="#38bdf8">V1 DECISION SPEED : 139 KIAS (BALANCED)</text>
  <text x="350" y="425" font-family="monospace" font-size="11" fill="#38bdf8">VR ROTATION SPEED : 143 KIAS</text>
  <text x="350" y="455" font-family="monospace" font-size="11" fill="#10b981">V2 TAKEOFF SAFETY : 151 KIAS (OEI 2ND SEG)</text>
  <text x="350" y="485" font-family="monospace" font-size="11" fill="#10b981">REQUIRED ASDA     : 2,538 m (&lt; 4,000 m)</text>
  <text x="350" y="515" font-family="monospace" font-size="11" fill="#a855f7">DATA DIODE STATUS : UNIDIRECTIONAL (ACD SAFE)</text>

  <!-- Right: Auditor -->
  <rect x="710" y="70" width="270" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="725" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">10-POINT NORMATIVE AUDIT</text>

  <g transform="translate(725, 120)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. ARINC 828A Connectors</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 160)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. ARINC 429 Bit 32 Parity</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 200)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. Label Bit-Reversal</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 240)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">4. DO-257B Surface NIC 8</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 280)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">5. AC 120-76D Data Diode</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 320)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">6. OPT V-Speeds (V1/VR/V2)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 360)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">7. ASDA Feasibility Check</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 400)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">8. Weight-on-Wheels (WOW)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 440)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">9. SSM Normal Nav (11b)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 480)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">10. Boeing/Airbus EFB Interop</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
</svg>